<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emma — твой голосовой репетитор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
    padding: 16px; color: #333;
  }
  .card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    width: 100%; max-width: 460px;
    overflow: hidden; display: flex; flex-direction: column;
    height: 90vh; max-height: 780px;
  }

  /* ==== Экран настройки ==== */
  #setupScreen {
    padding: 32px 24px; display: flex; flex-direction: column; gap: 20px;
    justify-content: center; height: 100%;
  }
  #setupScreen h1 {
    font-size: 24px; text-align: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #setupScreen p.subtitle { text-align: center; color: #888; font-size: 14px; margin-top: -12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: #555; }
  .field select {
    padding: 12px 14px; border-radius: 12px;
    border: 2px solid #e0e0e0; font-size: 15px;
    background: #fafafa; cursor: pointer; transition: border-color 0.2s;
  }
  .field select:focus { outline: none; border-color: #764ba2; }
  #startBtn {
    padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: transform 0.15s;
  }
  #startBtn:hover { transform: translateY(-2px); }

  /* ==== Экран чата ==== */
  #chatScreen { display: none; flex-direction: column; height: 100%; }
  header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; justify-content: center; align-items: center;
    font-size: 26px; border: 2px solid rgba(255,255,255,0.5);
    transition: box-shadow 0.3s;
  }
  .avatar.speaking { box-shadow: 0 0 0 4px rgba(255,255,255,0.6); animation: pulse 1s infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .header-info { flex: 1; }
  .header-info .name { font-size: 17px; font-weight: 700; }
  .header-info .status { font-size: 12px; opacity: 0.85; }
  .icon-btn {
    background: rgba(255,255,255,0.2); border: none;
    color: #fff; width: 38px; height: 38px; border-radius: 50%;
    font-size: 17px; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    transition: background 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.35); }
  .icon-btn.muted { background: rgba(0,0,0,0.3); }

  #chatLog {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    background: #f7f7fb;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 16px;
    font-size: 15px; line-height: 1.4; word-wrap: break-word;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: #fff; color: #333; border: 1px solid #e6e6ee; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: #999; font-size: 12px; font-style: italic; padding: 4px; }

  .controls {
    padding: 14px 16px; background: #fff; border-top: 1px solid #eee;
    display: flex; justify-content: center; align-items: center; gap: 12px;
  }
  #micBtn {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(118,75,162,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex; justify-content: center; align-items: center;
  }
  #micBtn:hover { transform: scale(1.05); }
  #micBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #micBtn.listening {
    background: linear-gradient(135deg, #ff5e7e, #ff2d55);
    animation: pulse 1s infinite;
  }

  #statusBar {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap;
  }
  #statusBar.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">

  <!-- ============ ЭКРАН НАСТРОЙКИ ============ -->
  <div id="setupScreen">
    <h1>👩‍🏫 Emma</h1>
    <p class="subtitle">Твой голосовой репетитор английского</p>

    <div class="field">
      <label for="learnLang">Какой язык изучаешь?</label>
      <select id="learnLang">
        <option value="English" selected>English (Английский)</option>
        <option value="Spanish">Spanish (Испанский)</option>
        <option value="German">German (Немецкий)</option>
        <option value="French">French (Французский)</option>
        <option value="Italian">Italian (Итальянский)</option>
      </select>
    </div>

    <div class="field">
      <label for="nativeLang">Твой родной язык?</label>
      <select id="nativeLang">
        <option value="Russian" selected>Русский</option>
        <option value="Ukrainian">Українська</option>
        <option value="Kazakh">Қазақша</option>
        <option value="English">English</option>
        <option value="Spanish">Español</option>
      </select>
    </div>

    <button id="startBtn">Начать общение 💬</button>
  </div>

  <!-- ============ ЭКРАН ЧАТА ============ -->
  <div id="chatScreen">
    <header>
      <div class="avatar" id="avatar">👩‍🏫</div>
      <div class="header-info">
        <div class="name">Emma</div>
        <div class="status" id="emmaStatus">Онлайн</div>
      </div>
      <button class="icon-btn" id="muteBtn" title="Выключить/включить голос Emma">🔊</button>
      <button class="icon-btn" id="resetBtn" title="Начать заново">↻</button>
    </header>

    <div id="chatLog"></div>

    <div class="controls">
      <button id="micBtn" title="Нажми и говори">🎤</button>
    </div>
    <div id="statusBar"></div>
  </div>

</div>

<script>
/* =========================================================
   НАСТРОЙКИ
   ========================================================= */
const API_KEY = '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';
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const MODEL   = 'llama-3.3-70b-versatile'; // бесплатная быстрая модель у Groq

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let learningLang = 'English';
let nativeLang   = 'Russian';
let history      = [];       // история диалога для AI
let isMuted      = false;
let isBusy       = false;    // ждём ли ответа от AI

/* =========================================================
   DOM
   ========================================================= */
const setupScreen  = document.getElementById('setupScreen');
const chatScreen   = document.getElementById('chatScreen');
const startBtn     = document.getElementById('startBtn');
const learnLangSel = document.getElementById('learnLang');
const nativeLangSel= document.getElementById('nativeLang');
const chatLog      = document.getElementById('chatLog');
const micBtn       = document.getElementById('micBtn');
const muteBtn      = document.getElementById('muteBtn');
const resetBtn     = document.getElementById('resetBtn');
const avatar       = document.getElementById('avatar');
const emmaStatus   = document.getElementById('emmaStatus');
const statusBar    = document.getElementById('statusBar');

/* =========================================================
   ПРОВЕРКА ПОДДЕРЖКИ БРАУЗЕРОМ
   ========================================================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  alert('Ваш браузер не поддерживает распознавание речи. Откройте сайт в Chrome или Edge.');
}
const recognition = new SpeechRecognition();
recognition.continuous = false;
recognition.interimResults = false;
recognition.maxAlternatives = 1;

const synth = window.speechSynthesis;

/* =========================================================
   ВЫБОР ЖЕНСКОГО ГОЛОСА
   ========================================================= */
let femaleVoice = null;

function pickFemaleVoice() {
  const voices = synth.getVoices();
  if (!voices.length) return;

  const langCode = {
    'English': 'en', 'Spanish': 'es', 'German': 'de',
    'French': 'fr', 'Italian': 'it'
  }[learningLang] || 'en';

  // Приоритет: 1) женский голос нужного языка, 2) любой голос нужного языка, 3) любой женский, 4) первый
  const byLang = voices.filter(v => v.lang.toLowerCase().startsWith(langCode));

  const femaleNames = ['female','woman','zira','samantha','victoria','karen','moira','tessa','google uk english female','google us english','milena','yelda','alice','elsa','paulina','lucia'];
  const isFemale = v => femaleNames.some(n => v.name.toLowerCase().includes(n));

  femaleVoice =
    byLang.find(isFemale) ||
    byLang[0] ||
    voices.find(isFemale) ||
    voices[0];
}

synth.onvoiceschanged = pickFemaleVoice;
pickFemaleVoice();

/* =========================================================
   СТАРТ
   ========================================================= */
startBtn.addEventListener('click', () => {
  learningLang = learnLangSel.value;
  nativeLang   = nativeLangSel.value;

  recognition.lang = {
    'English': 'en-US', 'Spanish': 'es-ES', 'German': 'de-DE',
    'French': 'fr-FR', 'Italian': 'it-IT'
  }[learningLang] || 'en-US';

  history = [{
    role: 'system',
    content:
`You are Emma, a warm and friendly female ${learningLang} tutor. The user's native language is ${nativeLang}.

RULES:
1. ALWAYS reply in ${learningLang} (the language the user is learning). Do NOT use ${nativeLang} for the main reply.
2. Keep replies SHORT (1-3 sentences). This is a spoken conversation, not an essay.
3. Be natural and friendly, like a real girl chatting. Use simple everyday language.
4. If the user makes a grammar/vocabulary mistake, gently correct it in a very short note at the end in this format: "(Correct: ...)" — but only if it's a real mistake.
5. Always end with a short follow-up question to keep the conversation going.
6. Ask about their day, hobbies, dreams, favorite food, movies, travel — anything to practice real conversation.
7. Never say you're an AI or a bot. You are Emma.`
  }];

  setupScreen.style.display = 'none';
  chatScreen.style.display  = 'flex';

  addMsg('system', `Ты изучаешь ${learningLang}. Emma будет говорить только на нём.`);
  greetUser();
});

/* =========================================================
   ПРИВЕТСТВИЕ
   ========================================================= */
async function greetUser() {
  setStatus('Emma думает...');
  const reply = await askAI('(The user just joined. Greet them warmly in ' + learningLang + ' and ask one simple question to start.)');
  addMsg('bot', reply);
  await speak(reply);
}

/* =========================================================
   МИКРОФОН
   ========================================================= */
micBtn.addEventListener('click', () => {
  if (isBusy) return;
  try { recognition.start(); } catch(e) {}
});

recognition.onstart = () => {
  micBtn.classList.add('listening');
  micBtn.textContent = '⏹';
  setStatus('Слушаю тебя...', true);
};

recognition.onend = () => {
  micBtn.classList.remove('listening');
  micBtn.textContent = '🎤';
};

recognition.onerror = (e) => {
  console.warn('STT error:', e.error);
  if (e.error === 'not-allowed') setStatus('Разреши доступ к микрофону');
};

recognition.onresult = async (event) => {
  const userText = event.results[0][0].transcript.trim();
  if (!userText) return;

  addMsg('user', userText);
  history.push({ role: 'user', content: userText });

  isBusy = true;
  micBtn.disabled = true;
  setStatus('Emma думает...', true);

  const reply = await askAI(null);
  addMsg('bot', reply);
  history.push({ role: 'assistant', content: reply });

  await speak(reply);

  isBusy = false;
  micBtn.disabled = false;
  setStatus('');
};

/* =========================================================
   ЗАПРОС К GROQ
   ========================================================= */
async function askAI(extraPrompt) {
  const messages = extraPrompt
    ? [...history, { role: 'user', content: extraPrompt }]
    : history;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + API_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        messages,
        temperature: 0.85,
        max_tokens: 200
      })
    });

    if (!res.ok) {
      const err = await res.text();
      console.error('Groq error:', err);
      return 'Sorry, I had a problem thinking. Try again.';
    }

    const data = await res.json();
    return data.choices[0].message.content.trim();
  } catch (e) {
    console.error(e);
    return 'Sorry, no connection. Check the internet.';
  }
}

/* =========================================================
   ОЗВУЧКА
   ========================================================= */
function speak(text) {
  return new Promise((resolve) => {
    if (isMuted || !text) { resolve(); return; }

    synth.cancel();
    const clean = text.replace(/\(Correct:.*?\)/gi, '').trim();

    const u = new SpeechSynthesisUtterance(clean);
    u.lang = {
      'English': 'en-US', 'Spanish': 'es-ES', 'German': 'de-DE',
      'French': 'fr-FR', 'Italian': 'it-IT'
    }[learningLang] || 'en-US';
    u.rate  = 0.95;
    u.pitch = 1.15;   // чуть выше — звучит более "девичье"
    u.volume = 1;

    if (femaleVoice) u.voice = femaleVoice;

    u.onstart = () => {
      avatar.classList.add('speaking');
      emmaStatus.textContent = 'Говорит...';
    };
    u.onend = () => {
      avatar.classList.remove('speaking');
      emmaStatus.textContent = 'Онлайн';
      resolve();
    };
    u.onerror = () => {
      avatar.classList.remove('speaking');
      emmaStatus.textContent = 'Онлайн';
      resolve();
    };

    synth.speak(u);
  });
}

/* =========================================================
   ВСПОМОГАТЕЛЬНОЕ
   ========================================================= */
function addMsg(type, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

let statusTimer = null;
function setStatus(text, persist = false) {
  clearTimeout(statusTimer);
  if (!text) { statusBar.classList.remove('show'); return; }
  statusBar.textContent = text;
  statusBar.classList.add('show');
  if (!persist) statusTimer = setTimeout(() => statusBar.classList.remove('show'), 2000);
}

/* =========================================================
   КНОПКИ
   ========================================================= */
muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', isMuted);
  if (isMuted) synth.cancel();
});

resetBtn.addEventListener('click', () => {
  synth.cancel();
  history = history.slice(0, 1); // оставляем system-промпт
  chatLog.innerHTML = '';
  addMsg('system', 'Начинаем заново.');
  greetUser();
});
</script>
</body>
</html>
