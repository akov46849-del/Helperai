<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emma — твой голосовой репетитор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 16px; color: #333;
  }
  .card {
    background: #fff; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    width: 100%; max-width: 460px; overflow: hidden;
    display: flex; flex-direction: column;
    height: 92vh; max-height: 800px;
  }

  /* setup */
  #setupScreen {
    padding: 32px 24px; display: flex; flex-direction: column; gap: 20px;
    justify-content: center; height: 100%;
  }
  #setupScreen h1 {
    font-size: 24px; text-align: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #setupScreen p.subtitle { text-align: center; color: #888; font-size: 14px; margin-top: -12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: #555; }
  .field select {
    padding: 12px 14px; border-radius: 12px; border: 2px solid #e0e0e0;
    font-size: 15px; background: #fafafa; cursor: pointer;
  }
  #startBtn {
    padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  #warning {
    background: #fff3cd; border: 1px solid #ffeeba; color: #856404;
    padding: 10px; border-radius: 10px; font-size: 13px; line-height: 1.4;
    display: none;
  }

  /* chat */
  #chatScreen { display: none; flex-direction: column; height: 100%; }
  header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; padding: 14px 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; justify-content: center; align-items: center;
    font-size: 24px; border: 2px solid rgba(255,255,255,0.5);
  }
  .avatar.speaking { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .header-info { flex: 1; min-width: 0; }
  .header-info .name { font-size: 16px; font-weight: 700; }
  .header-info .status { font-size: 12px; opacity: 0.9; }

  .icon-btn {
    background: rgba(255,255,255,0.2); border: none; color: #fff;
    min-width: 38px; height: 38px; padding: 0 10px; border-radius: 20px;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.35); }
  .icon-btn.muted { background: rgba(0,0,0,0.35); }

  #chatLog {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    background: #f7f7fb;
  }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 16px;
    font-size: 15px; line-height: 1.4; word-wrap: break-word;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: #fff; color: #333; border: 1px solid #e6e6ee; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: #999; font-size: 12px; font-style: italic; padding: 4px; }
  .msg .translation { display: block; margin-top: 6px; font-size: 13px; color: #7a5cff; font-style: italic; }

  .input-row {
    padding: 10px 12px; background: #fff; border-top: 1px solid #eee;
    display: flex; gap: 8px; align-items: center;
  }
  #textInput {
    flex: 1; padding: 10px 14px; border-radius: 20px;
    border: 2px solid #e0e0e0; font-size: 15px; outline: none;
  }
  #textInput:focus { border-color: #764ba2; }
  #sendBtn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; width: 42px; height: 42px;
    border-radius: 50%; font-size: 18px; cursor: pointer;
  }

  .controls {
    padding: 10px 16px 16px; background: #fff;
    display: flex; justify-content: center; align-items: center; gap: 14px;
  }
  #langToggle {
    padding: 8px 14px; border-radius: 20px; border: 2px solid #764ba2;
    background: #fff; color: #764ba2; font-weight: 700; font-size: 13px;
    cursor: pointer; min-width: 70px;
  }
  #langToggle:hover { background: #f3eeff; }
  #micBtn {
    width: 68px; height: 68px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 30px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(118,75,162,0.4);
    display: flex; justify-content: center; align-items: center;
    transition: transform 0.15s;
  }
  #micBtn:hover { transform: scale(1.05); }
  #micBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #micBtn.listening {
    background: linear-gradient(135deg, #ff5e7e, #ff2d55);
    animation: pulse 1s infinite;
  }

  #statusBar {
    position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.78); color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap; max-width: 90%;
  }
  #statusBar.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">

  <!-- ========== SETUP ========== -->
  <div id="setupScreen">
    <h1>👩‍🏫 Emma</h1>
    <p class="subtitle">Твой голосовой репетитор английского</p>

    <div id="warning"></div>

    <div class="field">
      <label for="learnLang">Какой язык изучаешь?</label>
      <select id="learnLang">
        <option value="English" selected>English (Английский)</option>
        <option value="Spanish">Spanish (Испанский)</option>
        <option value="German">German (Немецкий)</option>
        <option value="French">French (Французский)</option>
        <option value="Italian">Italian (Итальянский)</option>
      </select>
    </div>

    <div class="field">
      <label for="nativeLang">Твой родной язык?</label>
      <select id="nativeLang">
        <option value="Russian" selected>Русский</option>
        <option value="Ukrainian">Українська</option>
        <option value="Kazakh">Қазақша</option>
        <option value="English">English</option>
        <option value="Spanish">Español</option>
      </select>
    </div>

    <button id="startBtn">Начать общение 💬</button>
  </div>

  <!-- ========== CHAT ========== -->
  <div id="chatScreen">
    <header>
      <div class="avatar" id="avatar">👩‍🏫</div>
      <div class="header-info">
        <div class="name">Emma</div>
        <div class="status" id="emmaStatus">Онлайн</div>
      </div>
      <button class="icon-btn" id="muteBtn" title="Голос Emma">🔊</button>
      <button class="icon-btn" id="resetBtn" title="Заново">↻</button>
    </header>

    <div id="chatLog"></div>

    <div class="input-row">
      <input type="text" id="textInput" placeholder="Или напиши сообщение...">
      <button id="sendBtn">➤</button>
    </div>

    <div class="controls">
      <button id="langToggle" title="Язык ввода">EN 🎤</button>
      <button id="micBtn" title="Нажми и говори">🎤</button>
      <span style="width:70px"></span>
    </div>

    <div id="statusBar"></div>
  </div>

</div>

<script>
/* =========================================================
   НАСТРОЙКИ
   ========================================================= */
const API_KEY = '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';
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const MODEL   = 'llama-3.3-70b-versatile';

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let learningLang = 'English';
let nativeLang   = 'Russian';
let history      = [];
let isMuted      = false;
let isBusy       = false;
let micPermissionGranted = false;
let inputLangMode = 'learn'; // 'learn' | 'native'

const LANG_CODES = {
  'English': 'en-US', 'Spanish': 'es-ES', 'German': 'de-DE',
  'French': 'fr-FR', 'Italian': 'it-IT',
  'Russian': 'ru-RU', 'Ukrainian': 'uk-UA', 'Kazakh': 'kk-KZ'
};

const LANG_SHORT = {
  'English':'EN','Spanish':'ES','German':'DE','French':'FR',
  'Italian':'IT','Russian':'RU','Ukrainian':'UA','Kazakh':'KZ'
};

/* =========================================================
   DOM
   ========================================================= */
const setupScreen  = document.getElementById('setupScreen');
const chatScreen   = document.getElementById('chatScreen');
const startBtn     = document.getElementById('startBtn');
const learnLangSel = document.getElementById('learnLang');
const nativeLangSel= document.getElementById('nativeLang');
const chatLog      = document.getElementById('chatLog');
const micBtn       = document.getElementById('micBtn');
const muteBtn      = document.getElementById('muteBtn');
const resetBtn     = document.getElementById('resetBtn');
const avatar       = document.getElementById('avatar');
const emmaStatus   = document.getElementById('emmaStatus');
const statusBar    = document.getElementById('statusBar');
const textInput    = document.getElementById('textInput');
const sendBtn      = document.getElementById('sendBtn');
const langToggle   = document.getElementById('langToggle');
const warningBox   = document.getElementById('warning');

/* =========================================================
   ПРОВЕРКА ОКРУЖЕНИЯ
   ========================================================= */
const isSecure = location.protocol === 'https:' ||
                 location.hostname === 'localhost' ||
                 location.hostname === '127.0.0.1';

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!isSecure) {
  warningBox.style.display = 'block';
  warningBox.innerHTML = '⚠️ Ты открыл файл как <b>file://</b> — микрофон работать не будет.<br>' +
    'Запусти в терминале: <code>python -m http.server 8000</code><br>' +
    'и открой <b>http://localhost:8000</b>';
}

if (!SpeechRecognition) {
  warningBox.style.display = 'block';
  warningBox.innerHTML += '<br>⚠️ Браузер не поддерживает распознавание речи. Используй Chrome или Edge.';
}

const recognition = SpeechRecognition ? new SpeechRecognition() : null;
if (recognition) {
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
}

const synth = window.speechSynthesis;

/* =========================================================
   ЖЕНСКИЙ ГОЛОС
   ========================================================= */
let femaleVoice = null;

function pickFemaleVoice() {
  const voices = synth.getVoices();
  if (!voices.length) return;
  const langCode = (LANG_CODES[learningLang] || 'en-US').split('-')[0];
  const byLang = voices.filter(v => v.lang.toLowerCase().startsWith(langCode));
  const femaleNames = ['female','woman','zira','samantha','victoria','karen','moira','tessa','google uk english female','google us english','google русский','milena','yelda','alice','elsa','paulina','lucia','katya'];
  const isFemale = v => femaleNames.some(n => v.name.toLowerCase().includes(n));
  femaleVoice = byLang.find(isFemale) || byLang[0] || voices.find(isFemale) || voices[0];
}
synth.onvoiceschanged = pickFemaleVoice;
pickFemaleVoice();

/* =========================================================
   СТАРТ
   ========================================================= */
startBtn.addEventListener('click', async () => {
  learningLang = learnLangSel.value;
  nativeLang   = nativeLangSel.value;

  history = [{
    role: 'system',
    content:
`You are Emma, a warm and friendly female ${learningLang} tutor. The user's native language is ${nativeLang}.

RULES:
1. Main reply ALWAYS in ${learningLang} (short, 1-3 sentences, natural, friendly).
2. If user writes/speaks in ${nativeLang} — understand them, but reply in ${learningLang}.
3. After your main reply, if there's something worth explaining or a new word — add a short note in ${nativeLang} in this exact format on a new line:
[${nativeLang}] твоё краткое пояснение или перевод.

4. If the user made a grammar/vocab mistake, gently correct it inside the note in ${nativeLang}, e.g.:
[${nativeLang}] Небольшая правка: "I goed" → "I went".

5. ALWAYS end with a short follow-up question in ${learningLang}.
6. Talk about everyday things: day, hobbies, food, travel, movies, dreams.
7. Never say you're an AI. You are Emma.`
  }];

  pickFemaleVoice();

  setupScreen.style.display = 'none';
  chatScreen.style.display  = 'flex';

  addMsg('system', `Ты изучаешь ${learningLang}. Emma говорит на ${learningLang} и поясняет на ${nativeLang}.`);
  updateLangToggle();

  // Заранее просим доступ к микрофону
  await requestMic();

  greetUser();
});

/* =========================================================
   ДОСТУП К МИКРОФОНУ
   ========================================================= */
async function requestMic() {
  if (micPermissionGranted) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    micPermissionGranted = true;
    setStatus('Микрофон разрешён ✓', true);
    setTimeout(() => setStatus(''), 1800);
    return true;
  } catch (e) {
    console.warn('Mic permission error:', e);
    let msg = 'Не удалось получить доступ к микрофону.';
    if (e.name === 'NotAllowedError') msg = 'Ты запретил доступ к микрофону. Разреши его в настройках сайта.';
    if (e.name === 'NotFoundError') msg = 'Микрофон не найден.';
    if (e.name === 'NotReadableError') msg = 'Микрофон занят другим приложением.';
    setStatus(msg, true);
    setTimeout(() => setStatus(''), 4000);
    return false;
  }
}

/* =========================================================
   ПРИВЕТСТВИЕ
   ========================================================= */
async function greetUser() {
  setStatus('Emma думает...');
  const reply = await askAI('(The user just joined. Greet them warmly in ' + learningLang + ' and ask one simple question. Include a short [${nativeLang}] line with translation.)');
  renderBotMessage(reply);
  await speak(reply);
}

/* =========================================================
   МИКРОФОН — обработчики
   ========================================================= */
micBtn.addEventListener('click', async () => {
  if (isBusy || !recognition) return;
  const ok = await requestMic();
  if (!ok) return;
  try {
    recognition.lang = LANG_CODES[
      inputLangMode === 'learn' ? learningLang : nativeLang
    ] || 'en-US';
    recognition.start();
  } catch (e) {
    console.warn(e);
  }
});

if (recognition) {
  recognition.onstart = () => {
    micBtn.classList.add('listening');
    micBtn.textContent = '⏹';
    setStatus('Слушаю...', true);
  };

  recognition.onend = () => {
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
    if (!isBusy) setStatus('');
  };

  recognition.onerror = (e) => {
    console.warn('STT error:', e.error);
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
    let m = 'Ошибка распознавания: ' + e.error;
    if (e.error === 'not-allowed') m = 'Доступ к микрофону запрещён.';
    if (e.error === 'no-speech') m = 'Речь не распознана, попробуй снова.';
    if (e.error === 'network') m = 'Проблема с сетью. Проверь интернет.';
    setStatus(m, true);
    setTimeout(() => setStatus(''), 3000);
  };

  recognition.onresult = async (event) => {
    const userText = event.results[0][0].transcript.trim();
    if (!userText) return;
    await handleUserMessage(userText);
  };
}

/* =========================================================
   ТЕКСТОВЫЙ ВВОД
   ========================================================= */
sendBtn.addEventListener('click', () => {
  const t = textInput.value.trim();
  if (!t || isBusy) return;
  textInput.value = '';
  handleUserMessage(t);
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});

/* =========================================================
   ОБРАБОТКА СООБЩЕНИЯ
   ========================================================= */
async function handleUserMessage(userText) {
  addMsg('user', userText);
  history.push({ role: 'user', content: userText });

  isBusy = true;
  micBtn.disabled = true;
  setStatus('Emma думает...', true);

  const reply = await askAI(null);
  renderBotMessage(reply);
  history.push({ role: 'assistant', content: reply });

  await speak(reply);

  isBusy = false;
  micBtn.disabled = false;
  setStatus('');
}

/* =========================================================
   GROQ API
   ========================================================= */
async function askAI(extraPrompt) {
  const messages = extraPrompt
    ? [...history, { role: 'user', content: extraPrompt }]
    : history;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + API_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        messages,
        temperature: 0.85,
        max_tokens: 260
      })
    });
    if (!res.ok) {
      const err = await res.text();
      console.error('Groq error:', err);
      return 'Sorry, I had a problem thinking. Try again.';
    }
    const data = await res.json();
    return data.choices[0].message.content.trim();
  } catch (e) {
    console.error(e);
    return 'Sorry, no connection. Check the internet.';
  }
}

/* =========================================================
   РЕНДЕР СООБЩЕНИЯ EMMA (с русским пояснением)
   ========================================================= */
function renderBotMessage(raw) {
  // Разбиваем ответ по строке с [Русский] или [<native>]
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const mainLines = [];
  const noteLines = [];

  const noteRe = new RegExp('^\\[' + nativeLang + '\\]\\s*', 'i');
  for (const line of lines) {
    if (noteRe.test(line)) noteLines.push(line.replace(noteRe, ''));
    else mainLines.push(line);
  }

  const div = document.createElement('div');
  div.className = 'msg bot';
  div.textContent = mainLines.join(' ') || raw;

  if (noteLines.length) {
    const tr = document.createElement('span');
    tr.className = 'translation';
    tr.textContent = '🇷🇺 ' + noteLines.join(' ');
    div.appendChild(tr);
  }

  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

/* =========================================================
   ОЗВУЧКА
   ========================================================= */
function speak(text) {
  return new Promise((resolve) => {
    if (isMuted || !text) { resolve(); return; }

    synth.cancel();

    // Убираем русскую сноску [Русский]... — её читать не нужно
    const noteRe = new RegExp('\\[' + nativeLang + '\\][^\\n]*', 'gi');
    let spoken = text.replace(noteRe, '').trim();
    // Убираем (Correct: ...) на всякий случай
    spoken = spoken.replace(/\(Correct:[^)]*\)/gi, '').trim();

    if (!spoken) { resolve(); return; }

    const u = new SpeechSynthesisUtterance(spoken);
    u.lang = LANG_CODES[learningLang] || 'en-US';
    u.rate = 0.95;
    u.pitch = 1.15;
    u.volume = 1;
    if (femaleVoice) u.voice = femaleVoice;

    u.onstart = () => {
      avatar.classList.add('speaking');
      emmaStatus.textContent = 'Говорит...';
    };
    u.onend = () => {
      avatar.classList.remove('speaking');
      emmaStatus.textContent = 'Онлайн';
      resolve();
    };
    u.onerror = () => {
      avatar.classList.remove('speaking');
      emmaStatus.textContent = 'Онлайн';
      resolve();
    };

    synth.speak(u);
  });
}

/* =========================================================
   ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА ВВОДА
   ========================================================= */
function updateLangToggle() {
  const label = inputLangMode === 'learn'
    ? LANG_SHORT[learningLang] + ' 🎤'
    : LANG_SHORT[nativeLang] + ' 🎤';
  langToggle.textContent = label;
}
langToggle.addEventListener('click', () => {
  inputLangMode = inputLangMode === 'learn' ? 'native' : 'learn';
  updateLangToggle();
  setStatus('Язык ввода: ' + (inputLangMode === 'learn' ? learningLang : nativeLang), true);
  setTimeout(() => setStatus(''), 1800);
});

/* =========================================================
   ВСПОМОГАТЕЛЬНОЕ
   ========================================================= */
function addMsg(type, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

let statusTimer = null;
function setStatus(text, persist = false) {
  clearTimeout(statusTimer);
  if (!text) { statusBar.classList.remove('show'); return; }
  statusBar.textContent = text;
  statusBar.classList.add('show');
  if (!persist) statusTimer = setTimeout(() => statusBar.classList.remove('show'), 2000);
}

muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  muteBtn.textContent = isMuted ? '🔇' : '🔊';
  muteBtn.classList.toggle('muted', isMuted);
  if (isMuted) synth.cancel();
});

resetBtn.addEventListener('click', () => {
  synth.cancel();
  history = history.slice(0, 1);
  chatLog.innerHTML = '';
  addMsg('system', 'Начинаем заново.');
  greetUser();
});
</script>
</body>
</html>
